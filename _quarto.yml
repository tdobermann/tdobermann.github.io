project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "papers/*.qmd"
    - "policy/*.qmd"
  resources:
    - CNAME
    - robots.txt
    # referenced only from a <source srcset>, which Quarto does not scan
    - images/profile.webp
    - tim-dobermann-cv.pdf

lang: en-GB
canonical-url: true

website:
  title: "Tim Dobermann"
  description: "Economist working on energy, climate, structural transformation, and growth in developing economies."
  site-url: "https://www.timdobermann.com"
  favicon: images/favicon.svg
  image: images/profile.jpg
  image-alt: "Tim Dobermann"
  search:
    location: navbar
    type: overlay
  back-to-top-navigation: true

  open-graph:
    locale: en_GB
    site-name: "Tim Dobermann"
  twitter-card:
    card-style: summary

  navbar:
    title: false
    background: light
    pinned: true
    collapse-below: lg
    right:
      - text: "Research"
        file: research.qmd
      - text: "Policy"
        file: policy.qmd
      - text: "Writing"
        file: media.qmd
      - text: "About"
        file: about.qmd
      - text: "CV"
        file: cv.qmd

  page-footer:
    left: "© 2026 Tim Dobermann"
    center:
      - text: "Email"
        href: mailto:t.dobermann@lse.ac.uk
      - text: "Google Scholar"
        href: https://scholar.google.com/citations?user=QSNCu9UAAAAJ
      - text: "LinkedIn"
        href: https://www.linkedin.com/in/timdobermann/
      - text: "GitHub"
        href: https://github.com/tdobermann
    right: "Built with [Quarto](https://quarto.org)"
    border: true

format:
  html:
    theme:
      light: flatly
    css: styles.css
    toc: false
    anchor-sections: false
    smooth-scroll: true
    fontsize: "1.05rem"
    linestretch: 1.65
    link-external-icon: false
    link-external-newwindow: false
    page-layout: full
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" media="print" onload="this.media='all'"
                href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
          <noscript><link rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"></noscript>
