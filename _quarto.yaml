project:
  type: website
  output-dir: _site

website:
  title: "Tim Dobermann"
  description: "Director of Research & Environmental Economist"
  site-url: "https://www.timdobermann.com"
  favicon: images/favicon.svg

  open-graph:
    locale: en_US
    site-name: "Tim Dobermann"
  twitter-card:
    card-style: summary

  page-footer:
    center: "© 2026 Tim Dobermann"
    border: false

  navbar:
    background: light
    pinned: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "Research & Policy"
        file: research.qmd
      - text: "Media"
        file: media.qmd
      - text: "CV"
        file: cv.qmd
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/timdobermann/
        aria-label: LinkedIn
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=QSNCu9UAAAAJ
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/tdobermann
        aria-label: GitHub

format:
  html:
    theme:
      light: flatly
    css: styles.css
    toc: false
    mainfont: "Charter, 'Bitstream Charter', 'Noto Serif', Georgia, serif"
    fontsize: "1.05rem"
    linestretch: 1.6
